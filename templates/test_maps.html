<!DOCTYPE html>
<html>
<head>
    <title>اختبار Google Maps API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        #map {
            height: 400px;
            width: 80%;
            margin: 20px auto;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        .status {
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            max-width: 600px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>🗺️ اختبار Google Maps API Key</h1>
    
    <div id="status"></div>
    
    <div id="map"></div>
    
    <script>
        function initMap() {
            try {
                // إنشاء خريطة (الإسماعيلية)
                const map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 30.5833, lng: 32.2667 },
                    zoom: 13
                });
                
                // إضافة Marker
                new google.maps.Marker({
                    position: { lat: 30.5833, lng: 32.2667 },
                    map: map,
                    title: 'الإسماعيلية'
                });
                
                // الـ API شغالة!
                document.getElementById('status').innerHTML = 
                    '<div class="status success"><h2>✅ نجح!</h2><p>الـ API Key شغالة بنجاح!</p></div>';
                
            } catch (error) {
                // في مشكلة
                document.getElementById('status').innerHTML = 
                    '<div class="status error"><h2>❌ خطأ!</h2><p>' + error.message + '</p></div>';
            }
        }
        
        function handleError() {
            document.getElementById('status').innerHTML = 
                '<div class="status error"><h2>❌ خطأ في تحميل Google Maps</h2>' +
                '<p>تأكد من:</p>' +
                '<ul style="text-align: right; display: inline-block;">' +
                '<li>الـ API Key صحيح</li>' +
                '<li>Maps JavaScript API مفعّل</li>' +
                '<li>Billing مفعّل في Google Cloud</li>' +
                '</ul></div>';
        }
    </script>
    
    <!-- ضع API Key هنا -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDUL3VSr78uyW4HhFhgDoM8BB4gpozJvM4&callback=initMap&language=ar"
            async defer
            onerror="handleError()">
    </script>
</body>
</html>
